$font = Ubuntu

general {
    hide_cursor = true
    ignore_empty_input = false
    immediate_render = true
}

auth {
    pam {
        enabled = true
        module = hyprlock
    }
    fingerprint {
        enabled = true
        ready_message = Scan your fingerprint to unlock
        present_message = Checking fingerprint...
    }
}

animations {
    enabled = false
}

background {
    color = rgb(1e1e2e)
}

label {
    text = $TIME
    font_family = $font
    font_size = 72
    color = rgb(cdd6f4)
    position = 0, 180
}

label {
    text = $USER · Locked
    font_family = $font
    font_size = 22
    color = rgb(cdd6f4)
    position = 0, 90
}

input-field {
    size = 380, 64
    position = 0, 0
    outline_thickness = 2
    rounding = 12
    inner_color = rgb(313244)
    outer_color = rgb(89b4fa)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    capslock_color = rgb(f9e2af)
    font_family = $font
    fade_on_empty = false
    placeholder_text = Password · Enter to unlock
    check_text = Checking password or YubiKey...
    fail_text = $PAMFAIL
}

label {
    text = Keyboard: $LAYOUT[English,Persian] · Super+Space to switch
    font_family = $font
    font_size = 14
    color = rgb(cdd6f4)
    position = 0, -65
}

label {
    text = YubiKey: connect, press Enter, then touch if required
    font_family = $font
    font_size = 14
    color = rgb(cdd6f4)
    position = 0, -100
}

label {
    text = $FPRINTPROMPT
    font_family = $font
    font_size = 16
    color = rgb(89b4fa)
    position = 0, -140
}

label {
    text = $FPRINTFAIL
    font_family = $font
    font_size = 14
    color = rgb(f38ba8)
    position = 0, -175
}
